# ============================================================================
# /etc/nginx/sites-available/sistemfe
#
# Reemplaza el site "sistemfe" YA EXISTENTE en tu servidor (el que sirve al
# sistema viejo, confirmado sin tráfico real) por esta versión: misma
# arquitectura de rutas que ya tenías funcionando (frontend SPA + /api hacia
# Laravel + /storage para archivos), pero con seguridad y rendimiento de
# producción encima, y lista para agregar el dominio wildcard cuando lo
# compres.
#
# Estructura real (monorepo, confirmada por diagnóstico):
#   /var/www/html/sistemfe/api-sistema-fe/public    <- Laravel (API)
#   /var/www/html/sistemfe/admin-start-kit/dist     <- frontend build (SPA)
#
# Instalación:
#   sudo cp nginx-sistemafe.conf /etc/nginx/sites-available/sistemfe
#   sudo nginx -t && sudo systemctl reload nginx
# (el symlink en sites-enabled/sistemfe ya existe, no hace falta recrearlo)
# ============================================================================

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;

# ----------------------------------------------------------------------------
# Puerto 80 — solo redirige a HTTPS (2026-09-21, certificado wildcard de
# Let's Encrypt emitido por DNS-01 vía Cloudflare, ver GUIA-DESPLIEGUE Fase 6).
# No hay ACME HTTP-01 acá a propósito: el wildcard solo se puede validar por
# DNS, así que este bloque no necesita servir /.well-known/acme-challenge.
#
# Redirect www.<tenant>.umbosystem.com -> <tenant>.umbosystem.com (sin
# "www."). Bug real encontrado en producción (2026-08-25): stancl/tenancy
# identifica el tenant tomando el PRIMER segmento del Host
# (InitializeTenancyBySubdomain::$subdomainIndex = 0) — con "www." delante,
# ese primer segmento es "www", no el tenant real, y responde 404 "Negocio
# no encontrado" en cualquier llamada a /api/*. Va ACÁ (server_name
# wildcard) y no en un server block aparte con server_name regex: el
# wildcard *.umbosystem.com de nginx matchea CUALQUIER cantidad de niveles
# de subdominio y siempre gana sobre cualquier regex (confirmado con
# `curl -H "Host: www.market.umbosystem.com"`). Único "if" del archivo:
# un solo return incondicional, el caso que la propia wiki de nginx ("if
# is evil") acepta como legítimo.
#
# En 443 NO se repite: el certificado wildcard no cubre hosts de 2 niveles
# (www.market.umbosystem.com), así que un cliente que entre directo por
# https://www.<tenant>... vería un error de certificado antes de poder
# redirigirlo. Quien escribe la URL sin esquema entra por 80 y este bloque
# lo corrige antes de que llegue a HTTPS.
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name umbosystem.com www.umbosystem.com *.umbosystem.com;

    if ($host ~* ^www\.(.+\.umbosystem\.com)$) {
        return 301 https://$1$request_uri;
    }

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Dominio real (umbosystem.com) — el wildcard es lo que permite
    # dakamu.umbosystem.com, agencia-demo.umbosystem.com, etc. sin que nginx
    # necesite saber cuál tenant es cada uno (lo resuelve stancl/tenancy
    # dentro de Laravel según el Host header). admin.umbosystem.com no cae
    # acá: nginx prioriza el server_name EXACTO de admin-panel.conf sobre
    # este wildcard, sin importar el orden de sites-enabled.
    server_name umbosystem.com www.umbosystem.com *.umbosystem.com;

    # Certificado wildcard (umbosystem.com + *.umbosystem.com), emitido con
    # `certbot certonly --dns-cloudflare`. Renovación automática por el timer
    # de systemd de certbot; nginx solo relee el certificado renovado si hay
    # un deploy-hook que lo recargue (/etc/letsencrypt/renewal-hooks/deploy/,
    # ver pasos en la respuesta de la sesión 2026-09-21 / GUIA Fase 6).
    ssl_certificate     /etc/letsencrypt/live/umbosystem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umbosystem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # HSTS: DELIBERADAMENTE sin activar todavía. Una vez que el navegador lo
    # recibe, se niega a abrir el sitio por HTTP durante todo el max-age —
    # si algo del HTTPS estuviera roto, no habría vuelta atrás rápida.
    # Activar (con max-age corto primero, ej. 300) recién tras una semana
    # de HTTPS estable:
    # add_header Strict-Transport-Security "max-age=300" always;

    root /var/www/html/sistemfe/admin-start-kit/dist;
    index index.html;

    client_max_body_size 25M;
    client_body_timeout 60s;

    access_log /var/log/nginx/sistemfe.access.log;
    error_log  /var/log/nginx/sistemfe.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Bloquear archivos sensibles (defensa en profundidad — no deberían
    # estar servibles nunca, pero por si acaso)
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(composer\.(json|lock)|artisan|\.env)$ { deny all; }

    # Frontend: SPA (admin-start-kit)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets por tenant (stancl/tenancy tenant_asset(), usado por
    # App\Services\StorageUrl::resolve() para servir fotos/avatares por
    # tenant). El modificador ^~ es obligatorio: sin él, cualquier imagen
    # (.jpg/.png/etc) cae en la regex de caché de abajo ANTES de llegar acá
    # (nginx resuelve regex en orden de aparición), y esa regla la busca
    # como archivo del build del SPA en vez de pasarla a Laravel -> 404
    # (síntoma real: fotos que se ven al subirlas pero rotas al reabrir el
    # formulario de edición, en cualquier módulo con fotos por tenant).
    location ^~ /tenancy/assets/ {
        limit_req zone=api_general burst=40 nodelay;
        alias /var/www/html/sistemfe/api-sistema-fe/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache agresivo de assets compilados con hash en el nombre
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archivos subidos (storage de Laravel)
    location /storage/ {
        alias /var/www/html/sistemfe/api-sistema-fe/storage/app/public/;
        expires 30d;
        access_log off;
    }

    # Auth/login: rate limit más estricto (ajusta la ruta si tu API usa otra)
    location ~ ^/api/(auth|login) {
        limit_req zone=api_auth burst=10 nodelay;
        alias /var/www/html/sistemfe/api-sistema-fe/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # API: hacia Laravel
    location /api {
        limit_req zone=api_general burst=40 nodelay;
        alias /var/www/html/sistemfe/api-sistema-fe/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/html/sistemfe/api-sistema-fe/public;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 90;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
