# ============================================================================
# /etc/nginx/sites-available/00-default
#
# Sitio "atrapa-todo": responde a cualquier petición cuyo Host no coincide con
# ningún server_name configurado (p. ej. entrar por la IP del VPS).
#
# Por qué existe: sin un default_server, nginx usa el PRIMER sitio cargado
# (orden alfabético de sites-enabled) → admin-panel. Entrando por
# https://<IP>/login aparecía el login del Super-Admin, visible para cualquier
# bot que recorra IPs y saltándose Cloudflare. Con esto la conexión se corta.
#
# No afecta la renovación del certificado (certbot usa --dns-cloudflare).
#
# Instalación (creado en el servidor el 23-nov-2026):
#   sudo cp nginx-00-default.conf /etc/nginx/sites-available/00-default
#   sudo ln -s /etc/nginx/sites-available/00-default /etc/nginx/sites-enabled/00-default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Antes de instalar: `grep -Rn default_server /etc/nginx/sites-enabled/` debe
# salir vacío (solo puede haber un default_server por puerto).
# Para quitarlo: sudo rm /etc/nginx/sites-enabled/00-default && sudo systemctl reload nginx
# ============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # Rechaza el handshake TLS sin necesidad de certificado (nginx >= 1.19.4).
    ssl_reject_handshake on;
}
