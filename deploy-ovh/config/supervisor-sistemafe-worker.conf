# /etc/supervisor/conf.d/sistemafe-worker.conf
#
# Mantiene vivos los workers de cola de Laravel (tenant provisioning,
# notificaciones, generación de PDF de cotizaciones, etc.). Sin esto, si
# usas QUEUE_CONNECTION=redis los jobs se quedan encolados y nunca corren.
#
# Instalación:
#   sudo apt install supervisor
#   sudo cp supervisor-sistemafe-worker.conf /etc/supervisor/conf.d/
#   sudo supervisorctl reread
#   sudo supervisorctl update
#   sudo supervisorctl start sistemafe-worker:*

[program:sistemafe-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/sistemfe/api-sistema-fe/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
directory=/var/www/html/sistemfe/api-sistema-fe
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=umbo
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/html/sistemfe/api-sistema-fe/storage/logs/worker.log
stopwaitsecs=90

; --max-time=3600 hace que el worker se reinicie cada hora solo, liberando
; memoria acumulada (evita leaks lentos en jobs de larga vida del proceso).
; numprocs=1: con RAM ajustada (ver diagnóstico) arrancamos con 1 solo
; worker. Súbelo a 2 únicamente si confirmas que sobra memoria real.
