# ============================================================================
# /etc/nginx/sites-available/admin-panel
#
# Vhost DEDICADO para central-panel (el panel del tenant padre/administrador
# de la plataforma) — es un proyecto frontend SEPARADO de admin-start-kit
# (ese es el panel de cada tenant), viven en carpetas distintas dentro del
# mismo monorepo:
#
#   /var/www/html/sistemfe/central-panel/dist      <- frontend (root de este site)
#   /var/www/html/sistemfe/api-sistema-fe/public    <- mismo backend Laravel
#
# Este archivo NO existía como archivo — se creó directo en el servidor con
# un heredoc la primera vez. Se agrega acá para que el próximo despliegue no
# dependa de recordarlo de memoria.
#
# Instalación:
#   sudo cp nginx-admin-panel.conf /etc/nginx/sites-available/admin-panel
#   sudo ln -s /etc/nginx/sites-available/admin-panel /etc/nginx/sites-enabled/admin-panel
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANTE: cambia "admin.tudominio.com" abajo por tu subdominio real
# ANTES de instalar (ej. admin.umbosystem.com).
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name admin.tudominio.com;

    root /var/www/html/sistemfe/central-panel/dist;
    index index.html;

    client_max_body_size 25M;
    client_body_timeout 60s;

    access_log /var/log/nginx/admin-panel.access.log;
    error_log  /var/log/nginx/admin-panel.error.log warn;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Bloquear archivos sensibles — misma defensa en profundidad que el site principal
    location ~ /\.(?!well-known).* { deny all; }
    location ~ ^/(composer\.(json|lock)|artisan|\.env)$ { deny all; }

    # Frontend: SPA (central-panel)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo de assets compilados con hash en el nombre
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API: mismo backend Laravel que usa el site principal — un solo backend,
    # dos frontends distintos apuntando a él
    location /api {
        alias /var/www/html/sistemfe/api-sistema-fe/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/html/sistemfe/api-sistema-fe/public;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 90;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}

